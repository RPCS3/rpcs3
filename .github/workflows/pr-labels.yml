name: Label PRs

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:
  Label_PRs:
    name: Label PRs
    runs-on: ubuntu-latest
    if: github.repository == 'RPCS3/rpcs3'
    permissions:
      issues: read
      pull-requests: write
    steps:
      - name: Add labels
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const AREAS = [
              'Build and CI', 'CLI', 'Filesystem', 'GUI', 'Input', 'ISO', 'Localization', 'Overlay', 'Render: Vulkan', 'RSX', 'Savestates',
            ];
            const AI = /^\s*co-authored-by:.*\b(claude|anthropic|copilot|cursor|openai|chatgpt|gemini|codex)\b|generated with \[claude code\]/im;

            const {repository: {pullRequest: pull}} = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    labels(first: 100) { nodes { name } }
                    closingIssuesReferences(first: 50) { nodes { labels(first: 100) { nodes { name } } } }
                    timelineItems(itemTypes: [UNLABELED_EVENT], last: 100) { nodes { ... on UnlabeledEvent { label { name } } } }
                    commits(last: 100) { nodes { commit { message } } }
                  }
                }
              }`, {...context.repo, number: context.issue.number});

            // Skip labels a maintainer removed
            const removed = pull.timelineItems.nodes.map(x => x.label.name);
            const fromTitle = /^(\[TESTERS NEEDED\]\s*)?rsx\b/i.test(context.payload.pull_request.title) ? ['RSX'] : [];
            const fromIssues = pull.closingIssuesReferences.nodes.flatMap(i => i.labels.nodes.map(x => x.name));
            const fromAI = [context.payload.pull_request.body ?? '', ...pull.commits.nodes.map(x => x.commit.message)].some(x => AI.test(x)) ? ['Beep bop 🤖'] : [];
            const current = pull.labels.nodes.map(x => x.name);
            const areas = current.some(name => AREAS.includes(name)) ? [] : [...fromTitle, ...fromIssues].filter(name => AREAS.includes(name));
            const labels = [...new Set([...areas, ...fromAI])]
              .filter(name => !current.includes(name) && !removed.includes(name));

            if (labels.length > 0) {
              console.log(`Adding labels: ${labels.join(', ')}`);
              await github.rest.issues.addLabels({...context.repo, issue_number: context.issue.number, labels});
            }
