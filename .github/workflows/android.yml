name: Android APK

on:
  push:
    branches:
      - android-refresh
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        options: [debug, release]
        default: debug
      publish_release:
        description: Publish a signed GitHub Release (release variant only)
        type: boolean
        default: false
      draft_release:
        description: Create it as a draft so it can be reviewed before going live
        type: boolean
        default: true
      release_tag:
        description: Release tag, e.g. v0.1.0 (blank = auto from date and commit)
        type: string
        default: ''
      rebuild_deps:
        description: Force rebuild of LLVM and FFmpeg (ignores cache)
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NDK_VERSION: 29.0.14206865
  CMAKE_VERSION: 3.31.6
  ANDROID_API: 31
  VARIANT: ${{ inputs.variant || 'debug' }}
  PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.variant == 'release' }}
  DRAFT_RELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.draft_release }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Install NDK and CMake
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then
            manager=$(find "$sdk" -type f -name sdkmanager 2>/dev/null | head -1)
          fi
          if [ -z "$manager" ]; then
            echo "::error::sdkmanager not found under $sdk"
            exit 1
          fi
          echo "using $manager"
          yes | "$manager" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-deps-${{ env.NDK_VERSION }}
          max-size: 3G

      - name: Resolve LLVM revision
        id: llvmrev
        run: |
          sha=$(git rev-parse HEAD:3rdparty/llvm/llvm)
          if [ -z "$sha" ]; then
            echo "::error::could not resolve the 3rdparty/llvm/llvm submodule revision"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "llvm submodule pinned at $sha"

      - name: Cache prebuilt dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: android/prebuilt
          key: android-prebuilt-${{ env.NDK_VERSION }}-${{ hashFiles('android/build-llvm-android.sh', 'android/build-ffmpeg-android.sh', 'android/patches/*.patch') }}-${{ steps.llvmrev.outputs.sha }}

      - name: Build FFmpeg
        if: steps.deps.outputs.cache-hit != 'true' || inputs.rebuild_deps
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./build-ffmpeg-android.sh

      - name: Build LLVM
        if: steps.deps.outputs.cache-hit != 'true' || inputs.rebuild_deps
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./build-llvm-android.sh

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache native build tree
        uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: cxx-${{ env.VARIANT }}-${{ env.NDK_VERSION }}-${{ hashFiles('android/app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            cxx-${{ env.VARIANT }}-${{ env.NDK_VERSION }}-

      - name: Decode signing keystore
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::VARIANT=release needs the KEYSTORE_BASE64 secret; refusing to ship a debug-signed release"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          if [ ! -s "$RUNNER_TEMP/signing/release.jks" ]; then
            echo "::error::decoded keystore is empty - check the KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ "$VARIANT" = "release" ]; then suffix=Release; else suffix=Debug; fi
          flavors="standard antutu ludashi pubg"
          tasks=""
          for f in $flavors; do
            tasks="$tasks assemble${f^}${suffix}"
          done
          echo "gradle tasks:$tasks"
          ./gradlew --no-daemon --build-cache $tasks

      - name: Verify the native library is optimized
        working-directory: android
        run: |
          readelf=$(find "$ANDROID_NDK_HOME" -name llvm-readelf | head -1)
          rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck
          for apk in $(find app/build/outputs/apk -name '*.apk'); do
            unzip -o -q "$apk" 'lib/arm64-v8a/librpcs3-android.so' -d /tmp/apkcheck
            so=/tmp/apkcheck/lib/arm64-v8a/librpcs3-android.so
            text=$("$readelf" -S "$so" | awk '$2==".text"{print strtonum("0x"$6)}')
            echo "$(basename "$apk"): librpcs3-android.so .text = $text bytes"
            if [ "$text" -gt 70000000 ]; then
              echo "::error::$apk ships an unoptimized native library (-O0)"
              exit 1
            fi
          done

      - name: Verify release signature
        if: env.VARIANT == 'release'
        working-directory: android
        run: |
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          echo "using $apksigner"
          certs="$RUNNER_TEMP/apksigner-certs.txt"
          for apk in $(find app/build/outputs/apk -name '*-release*.apk'); do
            echo "== $(basename "$apk")"
            if ! "$apksigner" verify --print-certs "$apk" > "$certs" 2>&1; then
              cat "$certs"
              echo "::error::$apk failed signature verification"
              exit 1
            fi
            grep -E 'certificate DN|certificate SHA-256 digest' "$certs" || true
            if grep -qi 'CN=Android Debug' "$certs"; then
              echo "::error::$apk is debug-signed"
              exit 1
            fi
          done

      - name: Stage release assets
        if: env.PUBLISH_RELEASE == 'true'
        id: assets
        working-directory: android
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="v$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          mkdir -p "$RUNNER_TEMP/release"
          for f in standard antutu ludashi pubg; do
            src=$(find "app/build/outputs/apk/$f/release" -name '*.apk' | head -1)
            [ -n "$src" ] || { echo "::error::no release APK for flavor $f"; exit 1; }
            cp "$src" "$RUNNER_TEMP/release/ps3native-$f-$tag.apk"
          done

          cd "$RUNNER_TEMP/release"
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.assets.outputs.tag }}
          name: PS3Native ${{ steps.assets.outputs.tag }}
          draft: ${{ env.DRAFT_RELEASE == 'true' }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release/*.apk
            ${{ runner.temp }}/release/SHA256SUMS.txt

      - name: Summarise release
        if: env.PUBLISH_RELEASE == 'true'
        run: |
          tag="${{ steps.assets.outputs.tag }}"
          url="${{ steps.release.outputs.url }}"
          if [ "$DRAFT_RELEASE" = "true" ]; then
            {
              echo "### Draft release $tag"
              echo
              echo "Nothing is public yet and the tag is not created until you publish."
              echo "Review the APKs and notes, then hit **Publish release**."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Published release $tag"
              echo
              echo "This is live now."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$url" ]; then
            echo "$url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload standard APK
        uses: actions/upload-artifact@v4
        with:
          name: ps3native-standard-${{ env.VARIANT }}
          path: android/app/build/outputs/apk/standard/${{ env.VARIANT }}/*.apk
          if-no-files-found: error

      - name: Upload antutu APK
        uses: actions/upload-artifact@v4
        with:
          name: ps3native-antutu-${{ env.VARIANT }}
          path: android/app/build/outputs/apk/antutu/${{ env.VARIANT }}/*.apk
          if-no-files-found: error

      - name: Upload ludashi APK
        uses: actions/upload-artifact@v4
        with:
          name: ps3native-ludashi-${{ env.VARIANT }}
          path: android/app/build/outputs/apk/ludashi/${{ env.VARIANT }}/*.apk
          if-no-files-found: error

      - name: Upload pubg APK
        uses: actions/upload-artifact@v4
        with:
          name: ps3native-pubg-${{ env.VARIANT }}
          path: android/app/build/outputs/apk/pubg/${{ env.VARIANT }}/*.apk
          if-no-files-found: error
